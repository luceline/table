# Table de jeu : https://table.resgestae.fr (PocketBase dédié sur le port 8093)
# Fichier à copier dans /etc/nginx/sites-available/table, puis certbot ajoute le HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name table.resgestae.fr;

    client_max_body_size 10M;

    # Tableau de bord PocketBase : non exposé (tunnel SSH, voir README)
    location ^~ /_/ {
        deny all;
    }

    location / {
        proxy_pass http://127.0.0.1:8093;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Temps réel PocketBase (SSE) : pas de mise en tampon
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 360s;
    }
}
