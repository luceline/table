# À coller DANS le bloc server { ... } existant de resgestae.fr (celui en listen 443 ssl),
# avant les autres "location". Le reste du site n'est pas modifié.

# /table sans slash final -> /table/
location = /table {
    return 301 /table/;
}

# Tableau de bord PocketBase non exposé (y accéder par tunnel SSH, voir README)
location ^~ /table/_/ {
    deny all;
}

# Appli + API : le préfixe /table/ est retiré avant d'arriver à PocketBase (port 8093)
location ^~ /table/ {
    proxy_pass http://127.0.0.1:8093/;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    client_max_body_size 10M;

    # Temps réel PocketBase (SSE) : pas de mise en tampon
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 360s;
}
