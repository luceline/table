# Res Gestae sur son propre domaine. Certbot ajoute ensuite le HTTPS (listen 443 et certificats).
server {
    server_name resgestae.fr;

    root /var/www/heros/dist;
    index index.html;
    client_max_body_size 5m;

    # ===== Table de jeu : déménagée sur https://table.resgestae.fr =====
    # Les anciens liens (y compris ?join=CODE) sont renvoyés vers la nouvelle adresse.
    location = /table {
        return 301 https://table.resgestae.fr/$is_args$args;
    }
    location ^~ /table/ {
        return 301 https://table.resgestae.fr/$is_args$args;
    }
    # ===== Fin table de jeu =====

    # Service de jeu (anti-triche) : seul à enregistrer les parties
    location /api/game/ {
        proxy_pass http://127.0.0.1:8096;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8095;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Tchat en direct (flux SSE de PocketBase) : pas de mise en tampon, connexion longue
    location /api/realtime {
        proxy_pass http://127.0.0.1:8095;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 1h;
    }

    location /_/ {
        proxy_pass http://127.0.0.1:8095;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Application installable (PWA) : le service worker, la page et le manifeste ne doivent jamais rester en cache,
    # sinon les joueurs gardent une ancienne version. Les fichiers de /assets/ ont un nom unique par version.
    location = /sw.js { add_header Cache-Control "no-cache"; try_files $uri =404; }
    location = /index.html { add_header Cache-Control "no-cache"; try_files $uri =404; }
    location = /manifest.webmanifest {
        types { application/manifest+json webmanifest; }
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
    location /gc/ { try_files $uri =404; }
    location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; try_files $uri =404; }

    location / { try_files $uri $uri/ /index.html; }


    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/resgestae.fr/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/resgestae.fr/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

# www.resgestae.fr : renvoyé vers resgestae.fr
server {
    server_name www.resgestae.fr;
    return 301 https://resgestae.fr$request_uri;

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/resgestae.fr/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/resgestae.fr/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    if ($host = resgestae.fr) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name resgestae.fr;
    return 404; # managed by Certbot


}
server {
    if ($host = www.resgestae.fr) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name www.resgestae.fr;
    return 404; # managed by Certbot


}
